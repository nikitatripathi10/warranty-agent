name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit + integration, no live DB/API needed)
        env:
          # Dummy env vars so imports succeed without real secrets
          DATABASE_URL: sqlite:///./test_ci.db
          FERNET_KEY: ${{ secrets.FERNET_KEY_CI || 'dGVzdC1mZXJuZXQta2V5LXRoYXQtaXMtMzItYnl0ZXM=' }}
          GEMINI_API_KEY: ""
          GOOGLE_CLIENT_ID: "dummy"
          GOOGLE_CLIENT_SECRET: "dummy"
          GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/gmail/callback"
          FRONTEND_ORIGIN: "http://localhost:5173"
        run: |
          pytest tests/ -v --tb=short -q

      - name: Run validation metric script
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          FERNET_KEY: ${{ secrets.FERNET_KEY_CI || 'dGVzdC1mZXJuZXQta2V5LXRoYXQtaXMtMzItYnl0ZXM=' }}
          GEMINI_API_KEY: ""
          GOOGLE_CLIENT_ID: "dummy"
          GOOGLE_CLIENT_SECRET: "dummy"
          GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/gmail/callback"
          FRONTEND_ORIGIN: "http://localhost:5173"
        run: |
          python scripts/run_validation.py

  # ── Frontend Build Check ─────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: https://warranty-radar-api.up.railway.app
        run: npm run build

      - name: Check build output size
        run: |
          echo "Build output:"
          du -sh dist/
          ls -lh dist/assets/ | head -20

  # ── Docker Build Check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    # Only run on main branch pushes (not every PR) to save CI minutes
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: warranty-radar-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
