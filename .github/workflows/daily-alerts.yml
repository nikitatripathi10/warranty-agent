name: Daily Warranty Alerts Cron

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC (13:30 IST)
  workflow_dispatch:

jobs:
  run-daily-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend daily alert check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL or CRON_SECRET repo secret not configured — skipping external cron."
            exit 0
          fi
          # 503 means CRON_SECRET has not been set on Render yet. The backend's
          # in-process scheduler is still active, so treat that as a safe skip
          # instead of failing the workflow every day.
          status=$(curl --show-error --silent \
            --max-time 60 \
            --output /dev/null \
            --write-out "%{http_code}" \
            -X POST "${BACKEND_URL%/}/alerts/cron/run-daily" \
            -H "X-Cron-Secret: ${CRON_SECRET}") || {
              echo "Could not reach the backend."
              exit 1
            }
          echo "Daily alerts endpoint returned HTTP $status"
          if [ "$status" = "503" ]; then
            echo "CRON_SECRET is not configured on Render yet - skipping external cron (in-process scheduler is active)."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Unexpected response from the daily alerts endpoint."
            exit 1
          fi

