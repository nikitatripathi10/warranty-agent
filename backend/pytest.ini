[pytest]
# Run from the backend/ directory: venv\Scripts\pytest tests/ -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default addopts for CI-friendly output
addopts =
    --tb=short
    -q

# Show print() output (used by precision reporter)
log_cli = false

# Custom markers
markers =
    db: tests that require a database connection (SQLite in-memory or PostgreSQL)
    slow: tests that are slow (e.g. LLM API calls)
    unit: pure unit tests with no I/O

filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
